name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - run: uv pip install -r requirements-dev.txt
      - run: pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Package
        id: package
        run: echo "zip_path=$(scripts/package.sh "$RUNNER_TEMP/dist")" >> "$GITHUB_OUTPUT"
      - name: Start the packaged plugin on Python 3.8
        run: |
          uv python install 3.8
          "$(uv python find 3.8)" scripts/check_package.py "${{ steps.package.outputs.zip_path }}"

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install readwright==0.5.0
      - run: readwright check
